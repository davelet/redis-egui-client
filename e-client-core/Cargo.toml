[package]
name = "e-client-core"
version = "0.1.0"
edition = "2024"

[dependencies]
e-client-config = { path = "../e-client-config" }
e-client-basics = { path = "../e-client-basics" }
e-client-bilingual = { path = "../e-client-bilingual" }
tokio = { version = "1.0", features = ["full"] }
redis = { version = "1.0.2", features = ["tokio-native-tls-comp", "connection-manager"] }
serde_json = "1.0"
tracing = "0.1.44"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
dirs = "6.0"
toml = "0.9"

# AI Agent support via rig-core
rig-core = "0.33"
rig-derive = "0.1"
thiserror = "2"

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"
