[package]
name = "e-client-app"
version = "0.2.0"
edition = "2024"
repository = "https://github.com/davelet/redis-egui-client"
authors = ["Sheldon.Wei<sheldon.sh.hb@gmail.com>"]
readme = "README.md"
description = "A small Redis GUI client built with egui/eframe"
categories = ["gui"]
keywords = ["redis", "egui", "eframe", "gui"]

[dependencies]
e-client-config = { path = "../e-client-config" }
e-client-basics = { path = "../e-client-basics" }
egui = "0.33.3"
egui_extras = { version = "0.33.3", features = ["default"] }
eframe = { version = "0.33.3", default-features = false, features = [
    "default_fonts",
    "glow",
    "wgpu",
] }
tokio = { version = "1.0", features = ["full"] }
redis = { version = "1.0.2", features = ["tokio-native-tls-comp", "connection-manager"] }
serde_json = "1.0"
image = "0.25.9"
wgpu = { version = "27", features = ["metal", "dx12"]}
tracing = "0.1.44"
tracing-subscriber = "0.3.22"

[package.metadata.bundle]
name = "Rudist"
identifier = "com.sheldon.client.rudist"
icon = ["assets/icon.icns"]
category = "public.app-category.developer-tools"
short_description = "A small Redis GUI client built with egui/eframe"

[package.metadata.bundle.macOS]
entitlements = "entitlements.plist"

[package.metadata.wix]
upgrade-guid = "7B341871-490E-44C5-BE5B-9BDE6D84A371"
path-guid = "11E8DDEE-AA89-406C-9A09-8558E7D5BE88"
license = false
eula = false
